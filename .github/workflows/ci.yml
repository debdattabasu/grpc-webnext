name: CI

# One workflow for the polyglot monorepo: each language ecosystem is a job, and the
# TS job additionally drives the cross-language conformance matrix over the real wire.
#
# Third-party actions are pinned to a commit SHA (the tag in the trailing comment is what
# that SHA was at the time of writing) — a moving tag is a supply-chain hole.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust — server + proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # prost-build shells out to `protoc`; it is not vendored (see rust/Cargo.lock).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
          # grpc-webnext-client targets browsers; the host build proves almost
          # everything (h2ts-client is sans-I/O behind a pluggable transport), but
          # only this catches a dependency that cannot reach wasm at all.
          targets: wasm32-unknown-unknown

      # The Cargo workspace lives in rust/, not the repo root.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: rust

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked

      # build.rs refreshes the crate's vendored proto mirror from /proto on every
      # in-workspace build, so the `vendored_proto` test can never fail in CI — it compares
      # the *just-refreshed* copy. A mirror that was committed stale only shows up as a
      # dirty tree after the build above, which is what this checks.
      - name: Vendored proto mirror is committed in sync with /proto
        run: |
          if ! git diff --quiet -- rust/crates/grpc-webnext/proto/grpc_webnext.proto; then
            echo "::error::rust/crates/grpc-webnext/proto/grpc_webnext.proto is stale vs /proto."
            echo "Edit the proto at /proto only, then run a Rust build and commit the refreshed mirror."
            git diff -- rust/crates/grpc-webnext/proto/grpc_webnext.proto
            exit 1
          fi

      # A crates.io consumer has no repo root, so build.rs falls back to the vendored
      # mirror and the dev-only tests/ are excluded. Packaging verifies that path builds.
      - name: Package the crate (crates.io build, vendored-proto fallback)
        working-directory: rust
        run: cargo package -p grpc-webnext --locked

      # The client's whole point is running in a browser, and nothing else in the
      # workspace compiles for that target — a native-only regression here would
      # otherwise pass every other gate.
      - name: Build the WASM client for wasm32
        working-directory: rust
        run: cargo build -p grpc-webnext-client --target wasm32-unknown-unknown --locked

  node:
    name: node — TS client + conformance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The e2e / json / promise / h2ts / conformance suites spawn the Rust example
      # servers, so this job needs the full Rust toolchain too.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: rust

      # The conformance matrix runs every case against BOTH server implementations, so
      # this job builds and spawns the Go conformance server too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      # Those suites wait 60s for `LISTENING …` after `cargo run`; a cold compile inside
      # the test would blow that budget, so build the servers up front. (The conformance
      # runner also builds them itself, but warming the caches here keeps that cheap.)
      - name: Prebuild the Rust test servers
        working-directory: rust
        run: cargo build --locked -p devserver -p example-greeter-server -p conformance-server

      - name: Prebuild the Go conformance server
        working-directory: go
        run: go build -o target/conformance-server ./examples/conformance-server

      # Install/build/test from the workspace root: npm resolves a member install to the
      # root anyway, so node/package-lock.json is the lockfile that actually governs the
      # tree — and it is the one that carries every platform's optional binaries.
      - name: Install
        working-directory: node
        run: npm ci

      # Both workspaces: the client, and the server skeleton (typechecked, not left to rot).
      - name: Build
        working-directory: node
        run: npm run build

      # Unit + e2e + the conformance matrix (cases × transports × codecs).
      - name: Test
        working-directory: node
        run: npm test

  go:
    name: go — in-process server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      # The WebSocket path has a reader, a writer, and a keepalive ticker on one
      # connection, so the race detector earns its runtime here.
      - name: Test
        working-directory: go
        run: go test -race ./...

      # `go mod tidy` must be a no-op: a drifting go.mod/go.sum breaks a fresh clone.
      - name: go.mod is tidy
        working-directory: go
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum are not tidy; run 'go mod tidy' in go/ and commit."
            git diff -- go.mod go.sum
            exit 1
          fi
