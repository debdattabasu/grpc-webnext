[workspace]
resolver = "2"
members = [
    "crates/grpc-webnext",
    "crates/grpc-webnext-client",
    "crates/testecho",
    "crates/devserver",
    "examples/greeter-server",
    "examples/conformance-server",
    "examples/conformance-driver",
    "examples/tonic-stub-client",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debdattabasu/grpc-webnext"

[workspace.dependencies]
grpc-webnext = { path = "crates/grpc-webnext" }
