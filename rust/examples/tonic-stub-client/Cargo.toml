[package]
name = "example-tonic-stub-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Example: tonic's own generated client stubs, driven over a grpc-webnext tunnel."

[dependencies]
grpc-webnext-client = { path = "../../crates/grpc-webnext-client", features = ["tonic"] }
# The same minimal tonic a wasm frontend would use: no server, no channel, no TLS.
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
prost = "0.14"
futures = "0.3"
# The client is `!Send` by design, so everything runs on a current-thread runtime
# with a LocalSet — the same shape a browser gives it.
tokio = { version = "1", features = ["macros", "rt", "time", "net", "process", "io-util"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
# The tests run a real server in-process and drive it through generated stubs.
grpc-webnext = { path = "../../crates/grpc-webnext" }
testecho = { path = "../../crates/testecho" }

[build-dependencies]
tonic-prost-build = "0.14"
