[package]
name = "grpc-webnext-client"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Explicit for the same reason as the server crate's — see its comment.
documentation = "https://docs.rs/grpc-webnext-client"
description = "gRPC client for Rust WASM frontends, speaking real gRPC to a grpc-webnext endpoint over an h2ts WebSocket tunnel. No tonic, no hyper, no tokio."
readme = "README.md"
keywords = ["grpc", "wasm", "http2", "websocket", "frontend"]
categories = ["network-programming", "web-programming::http-client", "wasm"]
# The e2e test runs the real server in-process, so it depends on the in-workspace `grpc-webnext`
# and `testecho` crates through path dev-dependencies — which cargo strips on publish. Keep it
# out of the package rather than ship a test that cannot compile from a crates.io download.
exclude = ["tests/"]

# docs.rs defaults to x86_64-unknown-linux-gnu, where `connect` — the browser entry point, and
# the only thing in the crate behind `cfg(target_arch = "wasm32")` — does not exist. That made
# the rendered docs omit the crate's primary entry point *and* left `Client::from_connection`'s
# link to it dangling. Nothing here is gated to non-wasm, so the wasm32 docs are a strict
# superset: document that target alone rather than a host build the crate is not written for.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = []
# `tonic` is off by default (it is a bundle-size decision, not a docs one), so without
# this the rendered docs would omit the whole generated-stub story and the crate-level
# link to it would dangle.
all-features = true

[features]
default = ["prost"]
# Typed request/response helpers over `prost::Message`. Without it the client
# deals in raw message bytes and you bring your own codec.
prost = ["dep:prost"]
# Drive tonic's *generated* client stubs over the tunnel. Off by default: it puts
# tonic in the dependency tree (and so in the wasm bundle), which the crate's own
# API does not need. See `tonic_service`.
# `tonic/codegen` is not for the adapter — it needs none of it — but for the stubs
# the feature exists to run: generated client code opens with `use tonic::codegen::*`,
# so without it every user meets the same confusing error before writing a line.
tonic = ["dep:tonic", "tonic?/codegen", "dep:tower-service", "dep:http", "dep:http-body", "dep:bytes", "dep:send_wrapper"]

[dependencies]
# 0.1.2 for `Response::into_parts` — streaming a body while keeping the trailers
# readable, which is what makes a gRPC stream expressible. 0.1.3 resets the HTTP/2
# stream when a response body is dropped, which is what makes cancellation — and
# therefore a deadline — actually reach the server instead of just the caller.
h2ts-client = "0.1.3"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
base64 = "0.22"
percent-encoding = "2"
futures-timer = "3"
prost = { version = "0.14", optional = true }

# --- the `tonic` feature ---------------------------------------------------------
# `default-features = false` drops server, channel, router and TLS — none of which
# build for wasm, and none of which this needs: the adapter is a byte pipe, and
# tonic's client core (codec, metadata, status) is the only part it touches.
tonic = { version = "0.14", default-features = false, optional = true }
tower-service = { version = "0.3", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
bytes = { version = "1", optional = true }
# tonic's generated stubs bound `T::ResponseBody: Send`. The engine underneath is
# `!Send` on purpose, so the bound is satisfied by a wrapper that asserts it with a
# *runtime* thread check rather than an `unsafe impl` — one thread is what a browser
# has, and anything else panics instead of racing. `futures` for its `Future` impl.
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# futures-timer needs its wasm shim to reach setTimeout; without it a deadline
# would simply never fire in a browser.
futures-timer = { version = "3", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = "0.24"
futures = "0.3"
testecho = { path = "../testecho" }
grpc-webnext = { path = "../grpc-webnext" }
tonic = "0.14"
prost = "0.14"
