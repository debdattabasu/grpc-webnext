[package]
name = "grpc-webnext"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Set explicitly rather than left to crates.io: the sidebar link it infers is contingent on a
# *successful* docs.rs build, so the one release where docs.rs fails is also the release with no
# way to reach the docs. Stating the URL decouples the link from the build.
documentation = "https://docs.rs/grpc-webnext"
description = "Full bidirectional gRPC for the browser — real HTTP/2 over WebSockets (h2ts), plus JSON, REST, and a single-stream Frame protocol — served in front of any gRPC service, in-process (wrap a tonic Router) or as a standalone proxy."
readme = "README.md"
keywords = ["grpc", "grpc-web", "http2", "websocket", "proxy"]
categories = ["network-programming", "web-programming::http-server", "web-programming::websocket"]
# The integration tests are dev-only: they depend on the in-workspace `testecho` crate (a path
# dev-dependency cargo strips on publish), so they can't compile from a crates.io download. Keep
# them out of the package rather than ship tests that don't build.
exclude = ["tests/"]

[lib]
name = "grpc_webnext"
path = "src/lib.rs"

[[bin]]
name = "grpc-webnext-proxy"
path = "src/bin/proxy.rs"

[dependencies]
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-tungstenite = "0.20"
# 0.1.4 for the wslay-sys 0.1.2 it pulls in. 0.1.3 resolved wslay-sys 0.1.1, whose build.rs
# compiled the vendored wslay C without the HAVE_ARPA_INET_H / HAVE_NETINET_IN_H macros
# autotools would have supplied — leaving `htons`/`ntohs` implicitly declared. A warning on
# macOS and GCC <= 13 (and suppressed there by wslay-sys's own `-w`), a hard *error* on the
# newer GCC docs.rs builds with, which is why grpc-webnext 0.1.1 has no docs on docs.rs at all.
# A bump, not a relock: the published .crate carries its Cargo.lock, so docs.rs rebuilding
# 0.1.1 would resolve straight back to the broken wslay-sys.
h2ts-server = "0.1.4"
bytes = "1"
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"

[dev-dependencies]
testecho = { path = "../testecho" }
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
tokio-tungstenite = "0.29"
